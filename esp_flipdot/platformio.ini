; Dotflipper firmware
;
; Build:          pio run
; Upload (USB):   pio run -t upload
; Upload (OTA):   pio run -e ota -t upload
; Serial monitor: pio device monitor

[env]
platform = espressif32
board = pico32
framework = arduino
monitor_speed = 115200
; 2x 1.9MB app partitions (OTA) instead of 2x 1.25MB. Changing this requires one upload over USB.
board_build.partitions = min_spiffs.csv
lib_deps =
    tzapu/WiFiManager@^2.0.17

[env:pico32]

[env:ota]
upload_protocol = espota
upload_port = flipdot.local
upload_flags =
    --auth=admin
