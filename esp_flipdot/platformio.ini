; Dotflipper firmware
;
; v1 boards (PCA9685, ESP32 PICO):
;   Build:          pio run -e pico32
;   Upload (USB):   pio run -e pico32 -t upload
;   Upload (OTA):   pio run -e ota -t upload
; v3 boards (74HC595 chain, ESP32-S3-DevKitC-1):
;   Build:          pio run -e v3
;   Upload (USB):   pio run -e v3 -t upload
;   Upload (OTA):   pio run -e v3-ota -t upload
; Serial monitor:   pio device monitor

[env]
platform = espressif32
board = pico32
framework = arduino
monitor_speed = 115200
; 2x 1.9MB app partitions (OTA) instead of 2x 1.25MB. Changing this requires one upload over USB.
board_build.partitions = min_spiffs.csv
lib_deps =
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.0.0

[env:pico32]

[env:ota]
upload_protocol = espota
upload_port = flipdot.local
upload_flags =
    --auth=admin

[env:v3]
board = esp32-s3-devkitc-1
; 8 panels of 32x16 in 2 columns and 4 rows: 64x64 dots
build_flags = -DHARDWARE_V3 -DPANELS_X=2 -DPANELS_Y=4

[env:v3-ota]
extends = env:v3
upload_protocol = espota
upload_port = flipdot.local
upload_flags =
    --auth=admin
